<!DOCTYPE html>
<html>
<head>
	<title>Train</title>

<style>
	
	#train {
		display: flex;
		gap: 12px;
	}


.cart{
	border: 1px solid black;
	min-width: 100px;
	height: 80px;
	text-align: center;
	position: relative;
}

.cart:before{
	content: "";
	width: 30px;
	height: 30px;
	border: 1px solid black;
	display: block;
	border-radius: 50%;
	position: absolute;
	bottom:-15px;
	left:5px;
	background-color: white;





}
.cart:after{
	content: "";
	width: 30px;
	height: 30px;
	border: 1px solid black;
	display: block;
	border-radius: 50%;
	position: absolute;
	bottom:-15px;
	right:5px;
	background-color: white;
}
</style>




</head>
<body>





<input type="text" id="person">
<input type="color" id="colorPicker" name="">
<button id="add-person">add person</button>
<button id="remove-person">remove person</button>


<div id="train">
	</div>

<script>

let andrew = {
	name: "andrew",
	studentId: "c28ak",
	fav_color:"burlywood",
	lucky_num: 7
}
let augy = {
	name: "augy",
	studentId: "c29az",
	fav_color:"purple",
	lucky_num: 35
}

let people = [andrew, augy, {name: "gideon", fav_color: "black"}]
console.log(people)

let train = document.getElementById("train")
	
	// let people = ["faiz", "gideon", "august", "jason"]
	// let train = document.getElementById("train")
	

function makeTrain() {
	train.innerHTML =""
	for(let i = 0; i < people.length; i++){
		console.log(people[i])
		let cart= document.createElement("div")
		cart.textContent = people[i].name
		cart.style.backgroundColor = people[i].fav_color
		cart.classList.add("cart")
		train.appendChild(cart)
	}
}
makeTrain()
 

	
	let addPersonBtn = document.getElementById("add-person")
	addPersonBtn.addEventListener("click", function(){
		let personInput = document.getElementById("person")
		let colorpicker = document.getElementById("colorPicker")
			//people.push(personInput.value)
		people.push({
			name: personInput.value,
			fav_color: colorpicker.value,
		})


	



			

			console.log(people)
	 makeTrain() 
	})

let removePersonBtn = document.getElementById("remove-person")
	removePersonBtn.addEventListener("click", function(){
		let personInput = document.getElementById("person")
			makeTrain()
			people.pop()
			console.log(people)
		})


</script>

</body>
</html>
