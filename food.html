<!DOCTYPE html>
<html>
<head>
  <title>Taste of Manhattan</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3ee;
      color: #111;
      text-align: center;
    }

    header {
      padding: 30px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 5px;
    }

    p {
      color: #555;
    }

    #container {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 20px;
      flex-wrap: wrap;
    }

    #map {
      width: 330px;
      background: #111;
      padding: 15px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .neighborhood {
      background: white;
      margin: 8px;
      padding: 15px;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.2s;
      font-weight: bold;
    }

    .neighborhood:hover {
      background: #ffcc66;
      transform: scale(1.04);
    }

    #info {
      width: 420px;
      min-height: 500px;
      background: white;
      border-radius: 30px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      text-align: left;
    }

    #info h2 {
      text-align: center;
      font-size: 32px;
    }

    .restaurant {
      background: #f5f3ee;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .restaurant h3 {
      margin: 0;
    }

    .tag {
      display: inline-block;
      margin-top: 8px;
      padding: 5px 10px;
      background: #111;
      color: white;
      border-radius: 20px;
      font-size: 13px;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 20px;
      background: #111;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <h1>Taste of Manhattan</h1>
    <p>Click a neighborhood to find 3 restaurants worth trying.</p>
  </header>

  <div id="container">

    <div id="map">
      <div class="neighborhood" onclick="showRestaurants('Harlem')">Harlem</div>
      <div class="neighborhood" onclick="showRestaurants('Upper West Side')">Upper West Side</div>
      <div class="neighborhood" onclick="showRestaurants('Upper East Side')">Upper East Side</div>
      <div class="neighborhood" onclick="showRestaurants('Midtown')">Midtown</div>
      <div class="neighborhood" onclick="showRestaurants('Hell’s Kitchen')">Hell’s Kitchen</div>
      <div class="neighborhood" onclick="showRestaurants('Chelsea')">Chelsea</div>
      <div class="neighborhood" onclick="showRestaurants('West Village')">West Village</div>
      <div class="neighborhood" onclick="showRestaurants('SoHo')">SoHo</div>
      <div class="neighborhood" onclick="showRestaurants('Chinatown')">Chinatown</div>
      <div class="neighborhood" onclick="showRestaurants('Lower East Side')">Lower East Side</div>
      <div class="neighborhood" onclick="showRestaurants('Financial District')">Financial District</div>
    </div>

    <div id="info">
      <h2>Pick a neighborhood</h2>
      <p style="text-align:center;">Your top 3 restaurants will show up here.</p>
    </div>

  </div>

    function showRestaurants(neighborhood) {
      let info = document.getElementById("info");
      let places = restaurantData[neighborhood];

      let html = "<h2>" + neighborhood + "</h2>";

      for (let i = 0; i < places.length; i++) {
        html += `
          <div class="restaurant">
            <h3>${i + 1}. ${places[i].name}</h3>
            <span class="tag">${places[i].cuisine}</span>
            <span class="tag">${places[i].price}</span>
            <p>${places[i].description}</p>
          </div>
        `;
      }

      html += `<button onclick="randomPick('${neighborhood}')">Pick for me</button>`;

      info.innerHTML = html;
    }

    function randomPick(neighborhood) {
      let places = restaurantData[neighborhood];
      let randomNumber = Math.floor(Math.random() * places.length);
      let choice = places[randomNumber];

      alert("You should try: " + choice.name);
    }
  </script>
