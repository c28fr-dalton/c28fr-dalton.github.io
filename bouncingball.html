<!DOCTYPE html>
<html>
<head>
	
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.12/lib/p5.min.js"></script>


</head>
<body>

	<script>
		

let xpos
let ypos
let xspeed = 5
let yspeed = 8
let ballColor

function setup (){

	createCanvas (800,800)
	xpos = width/2
	ypos = height/2
	ballColor = color(255,0,0)

}


function draw (){
 background(0)

 if (xpos>width-25 || xpos < 25){
 	xspeed*= -1
 	ballColor = color(random(255), random(255), random(255))
}

 

 if (ypos>height-25 || ypos < 25){
 	yspeed*= -1
 	ballColor = color(random(255), random(255), random(255))


}

xpos += xspeed
ypos += yspeed


fill(ballColor)
circle (xpos,ypos,50)




}

	</script>

</body>
</html>
