<!DOCTYPE html>
<html>
<head>
	<style>
	
	.container{
		display: grid;
		grid-template-columns: repeat(4, 1fr);
	}
	.item{

		border: 1px solid black;

	}
	.item img{
		width: 100%;
		height:100%;
		object-fit: cover;

	}
	#fav{
		grid-column: 1 / 3;
		grid-row: 1 / 3;
	}
	@media (max-width: 800px) {
		.container{
			grid-template-columns: repeat(1, 1fr);
		}
	}
	</style>
</head>
<body>
	<div class="container">
		
	<div class="item">
		
		<img src="bam.jpeg" alt="bam adebayo">
	
	</div>
		
	<div class="item" id="fav">
		
		<img src="chae.jpeg" alt="chae">
	</div>
	
	<div class="item">
			
			<img src="kaya.jpeg" alt="kaya">
	</div>
		
	<div class="item">
		
		<img src="faiz.jpeg" alt="faiz">
	
	</div>
	
	<div class="item">
			
	<img src="augy.jpeg" alt="zuzu">
	
	</div>

</body>
</html>
