<!DOCTYPE html>
<html>
<head>
	
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.12/lib/p5.min.js"></script>


</head>
<body>

<script>
	
function setup() {
	createCanvas(800,800)

	 xpos = width/2
	 ypos = height/2

	
	


}

function draw () {

	let randomNumber = floor (random(4))
	let randomColor = random(["#450e8c"], ["#a997bf"], ["#2b2038"])
	if (randomNumber == 0){
		xpos = xpos + 8

	}

	else if (randomNumber == 1){
		xpos = xpos - 8

	}

		else if (randomNumber == 2){
		ypos = ypos + 8

	}

	else if (randomNumber == 3){
		ypos = ypos - 8

	}
	
	fill(randomColor)
	circle(xpos, ypos, 10)


print(randomNumber)
}

</script>


</body>
</html>
