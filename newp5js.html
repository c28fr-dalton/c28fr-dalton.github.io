<!DOCTYPE html>
<html>
<head>

<script 
src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js">
	
</script>


</head>
<body>

<script>
	
	function setup(){
		createCanvas (800,800)

	}

	function draw () {
		background (200)
		push()
		translate(100,100)
		rectMode(CENTER)
		//rotate(PI/8)
		rotate(frameCount * 0.05)
		rect(0,0,100,50)
		pop()


		push()
		rectMode(CENTER)
		translate(width/2,height/2)
		rotate(frameCount*0.1)
		rect(0,0,120,40)
		pop()


		push()
		translate(300,300)
		rotate(frameCount * 0.05)
		circle(250-300, 250-300,50)
		circle(350-300,250-300,50)
		pop()
	}


</script>


</body>
</html>
