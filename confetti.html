<!DOCTYPE html>
<html>
<head>
	
<style>
	.confetti{
		width: 35px;
		height: 10px;
		position: absolute;
		display: inline-block;
		animation-name: swing;
		animation-duration: 1.2s;
		animation-iteration-count: infinite;
		animation-direction: alternate;
	


	}

	@keyframes swing{
		from{
			transform: rotate(-45deg);
		}
		to{
			transform: rotate(45deg);
		}
	

	}

	@keyframes swing3d{
		from{
			transform: rotateZ(-25deg) rotateY(25deg);
		}
	to{
		transform: rotateZ(25deg) rotateY(180deg);
	}
	}

</style>
</head>
<body>



<button id="btn">drop confetti</button>
<input type="color" id="colorPicker">
<input type="range" min="1" max="10" step="1" id="slider">

<script type="text/javascript"> 


let dropConfettibtn = document.getElementById("btn")
let colorPicker = document.getElementById("colorPicker")
let slider = document.getElementById("slider")
function makeConfetti(){
	let square= document.createElement("div")
	square.classList.add("confetti")
	document.body.appendChild(square)
	
	let r=Math.round(Math.random()*255)
	let g=Math.round(Math.random()*255)
	let b=Math.round(Math.random()*255)
	
	let rotato= Math.round(Math.random()*360)
	// square.style.backgroundColor="rgb("+r + "," + g + "," +b+")"
	square.style.backgroundColor=colorPicker.value
	square.style.top=Math.random()*1000+"px"
	square.style.left=Math.random()*1500+"px"

	square.style.position="absolute"
	square.style.transform="rotate("+rotato+"deg)"

	function fall(){
		let fallFactor = 10
		square.style.top = parseInt(square.style.top) + fallFactor + "px"

		if (parseInt(square.style.top) > 1000){square.style.top = Math.random() * 100 * "px"}
	}
setInterval(fall, 60)
}



dropConfettibtn.addEventListener("click",function(){

	for (let i = 0; i < slider.value; i++) {
		makeConfetti()
	}
	// setInterval (makeConfetti, 10)
})


</script>

</body>
</html>
