<!DOCTYPE html>
<html>
<head>
	
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.12/lib/p5.min.js"></script>

</head>
<body>


<script>
	
	function setup() {
		createCanvas(2000,1000);

	}

function draw () {
	background(200)
for(let i = 0; i < 18; i++){
	
	for(let j = 0; j <18; j++){

	let y= j * 100
	
	let x=i * 100

	let d = dist(mouseX, mouseY, x, y);

	

	

	fill(200,100,100);
	circle(x-30, y-50,100)

	if (d < 500) {
		fill(100,100,200);
	} else {
		fill(250,100,100)
	}
	
	circle(x,y,100)
	
	fill(0);
	circle(x - 15, y - 25, 5); 
	circle(x + 15, y - 25, 5);

	noFill();          
	stroke(0);        
	strokeWeight(2);   
	arc(x, y-10 , 40, 30, 0, PI); 



		


}
}


}





</script>


</body>
</html>
